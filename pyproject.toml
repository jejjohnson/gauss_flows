[project]
name = "gauss_flows"
version = "0.1.3"
description = "JAX/FlowJax-based RBIG — density estimation and IT measures with normalizing flows"
authors = [
    { name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["normalizing flows", "density estimation", "information theory", "jax", "RBIG"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flowjax>=0.9",
    "equinox>=0.10",
    "numpyro>=0.13",
    "optax>=0.1",
    "paramax",
    "jaxtyping",
    "einops>=0.8.2",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gauss_flows"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.5.0",
    "pre-commit>=4.5.1",
    "scipy>=1.13",
]
lint = [
    "ruff>=0.15.10",
]
typecheck = [
    "ty>=0.0.29",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
    "jupytext>=1.19.1",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauss_flows"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ty.environment]
python-version = "3.12"

# TODO(phase-2): tighten these rules as FlowJax / NumPyro typing gaps are closed.
# Switching from mypy (--ignore-missing-imports) to ty surfaced pre-existing
# issues at the gauss_flows ↔ FlowJax / NumPyro boundary (Vmap attribute types,
# Distribution.sample/log_prob override shapes, etc.). Suppress for now; revisit
# per-rule during SurVAE implementation.
[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short --cov=src/gauss_flows --cov-report=term-missing --cov-report=xml:coverage.xml"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/gauss_flows"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
