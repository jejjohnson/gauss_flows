[project]
name = "gauss_flows"
version = "0.1.1"
description = "JAX/FlowJax-based RBIG — density estimation and IT measures with normalizing flows"
authors = [
    { name = "Juan Emmanuel Johnson", email = "jemanjohnson34@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
keywords = ["normalizing flows", "density estimation", "information theory", "jax", "RBIG"]
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flowjax>=0.9",
    "equinox>=0.10",
    "numpyro>=0.13",
    "optax>=0.1",
    "paramax",
    "jaxtyping",
]

[project.urls]
Repository = "https://github.com/jejjohnson/gauss_flows"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-pretty>=1.2.0",
    "pytest-xdist>=3.5.0",
    "coverage>=7.4.0",
]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "nbstripout>=0.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
