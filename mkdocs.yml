site_name: gauss_flows
site_description: JAX/FlowJax-based Gaussianization flows, SurVAE transforms, and information-theoretic utilities.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/gauss_flows
repo_name: jejjohnson/gauss_flows

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            filters: ["!^_"]
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true
      include: ["*.ipynb"]

nav:
  - Home: index.md
  - Examples:
      - Gaussianization Flow (2D): notebooks/01_gaussianization_flow_2d.ipynb
      - Coupling Flow (2D): notebooks/02_coupling_flow_2d.ipynb
      - RBIG Warm-Start: notebooks/03_rbig_warmstart.ipynb
      - Zero-Kernel Coupling ≡ Diagonal: notebooks/04_coupling_equivalence.ipynb
      - Toroidal Circular Flow: notebooks/torus_circular_flow.ipynb
      - FFJORD on Two Moons: notebooks/05_ffjord_2d.ipynb
      - Matrix-Exponential Neural Flow: notebooks/06_matrix_exponential_neural_flow.ipynb
      - Global Flow on the Sphere: notebooks/07_global_flow_sphere.ipynb
      - Conditional Flow Three Ways: notebooks/08_conditional_flow_three_ways.ipynb
      - Latent ODE on Spirals: notebooks/09_latent_ode_spirals.ipynb
      - Information-Theory Measures: notebooks/10_information_theory.ipynb
  - API Reference:
      - Overview: api/index.md
      - Bijections: api/bijections.md
      - Surjections & Stochastic: api/surjections.md
      - Base Distributions: api/distributions.md
      - Flows & RBIG: api/flows.md
      - NumPyro Inference: api/inference.md
      - Information Theory: api/info_theory.md
  - Contributing: contributing.md
  - Changelog: https://github.com/jejjohnson/gauss_flows/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
